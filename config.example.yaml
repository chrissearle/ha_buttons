# Copy to ~/.config/buttons/config.yaml (or pass --config <path> / set BUTTONS_CONFIG)
homeassistant:
  url: http://homeassistant.local:8123
  # Profile -> Security -> Long-lived access tokens in Home Assistant
  token: YOUR_LONG_LIVED_ACCESS_TOKEN
  # Only for https with a self-signed / private CA. PEM file; when set, ONLY this CA is trusted.
  # Not needed for Nabu Casa (https://xxxx.ui.nabu.casa) or other publicly trusted certificates.
  # ca_cert: ca.pem

ui:
  columns: 4

buttons:
  # Entity buttons toggle on/off and show live state
  - name: Desk lamp
    entity: light.desk
    icon: lightbulb

  - name: Guest mode
    entity: input_boolean.guest_mode
    icon: person

  # Action buttons call any Home Assistant action (domain.service)
  - name: Movie time
    action: script.turn_on
    target:
      entity_id: script.movie_time
    icon: movie

  # Action + entity: click runs the action, tile shows the entity's on/off state
  - name: Meeting
    entity: input_boolean.meeting_state
    action: script.meeting_change
    icon: person

  - name: Ping phone
    action: notify.mobile_app_my_phone
    data:
      message: Hello from Buttons
    icon: notifications
